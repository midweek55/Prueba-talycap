# Plantilla de configuracion de nginx.
# La imagen oficial de nginx sustituye ${URL_API} por el valor real de la
# variable de entorno URL_API al iniciar el contenedor (envsubst sobre
# /etc/nginx/templates/*.template -> /etc/nginx/conf.d/*.conf).

server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy de las llamadas a la API hacia el backend .NET dentro de la red de Docker
    location /api/ {
        proxy_pass ${URL_API}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todas las rutas de la SPA se redirigen a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
